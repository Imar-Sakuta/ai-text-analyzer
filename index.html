<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Text Analyzer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>AI Text Analyzer</h1>
    <p class="subtitle">Paste text or upload a PDF for analysis &amp; summary.</p>

    <textarea id="text" placeholder="Paste your text here..."></textarea>
    <p class="or">— OR —</p>

    <label class="file-label">
      <input type="file" id="pdf" accept=".pdf">
      <span>Choose a PDF</span>
    </label>
    <p id="file-name" class="file-name"></p>

    <button id="go">Analyze</button>
    <p id="loading" class="hidden">Analyzing...</p>

    <section id="out" class="hidden">
      <h2>Results</h2>
      <p><b>Word count:</b> <span id="wc"></span></p>
      <p><b>Top words:</b></p>
      <ul id="freq"></ul>
      <h2>Summary</h2>
      <p id="sum"></p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
